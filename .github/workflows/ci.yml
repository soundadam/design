name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod

      - name: Gate
        run: make check

      # The committed marks are what consumers get; they must be what the
      # generator writes.
      - name: Marks match the generator
        run: |
          make brand
          git diff --exit-code -- web/ brand/archive/
